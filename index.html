<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Pacific College Int'l</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    html,body{height:100%}
    body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem 1rem;
      background:radial-gradient(1200px 600px at 50% -10%,var(--navy-700) 0%,var(--navy-900) 60%)}
    .login{width:100%;max-width:400px}
    .login .brand{display:flex;flex-direction:column;align-items:center;gap:.75rem;margin-bottom:1.5rem;color:#fff;text-align:center}
    .login .mark{width:56px;height:56px;border-radius:16px;background:#fff;color:var(--navy-900);display:grid;place-items:center;font-weight:800;font-size:1.35rem;letter-spacing:.02em;box-shadow:0 6px 18px rgba(0,0,0,.25)}
    .login .brand-name{font-size:1.2rem;font-weight:700;letter-spacing:.01em;margin:0}
    .login .panel{background:var(--surface);border-radius:var(--r-lg);padding:2rem 1.75rem;box-shadow:0 18px 48px rgba(0,0,0,.28)}
    .login h1{font-size:1.4rem;margin-bottom:1.25rem}
    .pw{position:relative}
    .pw .input{padding-right:4.5rem}
    .pw .toggle{position:absolute;right:.25rem;top:50%;transform:translateY(-50%);min-height:36px;min-width:0;padding:0 .7rem;border:0;background:transparent;color:var(--navy-700);font-weight:600;font-size:.88rem;cursor:pointer;border-radius:var(--r-sm)}
    .pw .toggle:hover{background:var(--navy-100)}
    .login .submit{width:100%;margin-top:.25rem}
    .login footer{margin-top:1.5rem;text-align:center;color:rgba(255,255,255,.7);font-size:.8rem}
    @media (max-width:420px){.login .panel{padding:1.5rem 1.25rem}}
  </style>
</head>
<body>
  <main class="login">
    <div class="brand">
      <div class="mark" aria-hidden="true">PCI</div>
      <p class="brand-name">Pacific College Int'l</p>
    </div>
    <form class="panel" id="login" novalidate>
      <h1>Sign in</h1>
      <div class="field">
        <label for="id">Email or username</label>
        <input class="input" id="id" autocomplete="username" aria-invalid="false" required>
      </div>
      <div class="field">
        <label for="pw">Password</label>
        <div class="pw">
          <input class="input" id="pw" type="password" autocomplete="current-password" required>
          <button class="toggle" type="button" id="toggle" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <p class="field-error" id="err" role="alert"></p>
      </div>
      <button class="btn btn-primary submit">Sign in</button>
    </form>
    <footer>&copy; <span id="yr"></span> Pacific College Int'l</footer>
  </main>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>

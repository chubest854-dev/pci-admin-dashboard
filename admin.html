<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Pacific College Int'l</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="shell" id="admin-shell">
    <button class="mobile-nav-toggle" id="mobile-nav-toggle" type="button" aria-label="Open navigation" aria-controls="admin-sidebar" aria-expanded="false">☰ <span>Menu</span></button>
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
    <aside class="sidebar" id="admin-sidebar" aria-label="Admin navigation">
      <div class="brand-row">
        <div class="brand">PCI Admin<small>Pacific College International</small><small id="role-label"></small></div>
        <button class="sidebar-collapse" id="sidebar-collapse" type="button" aria-label="Collapse sidebar" aria-controls="side-nav" aria-expanded="true" title="Collapse sidebar">‹</button>
      </div>
      <nav id="side-nav" aria-label="Main navigation"></nav>
      <div class="side-foot"><p id="who"></p><button class="btn btn-light btn-sm" id="logout">Log out</button></div>
    </aside>
    <main class="main" id="view" tabindex="-1"></main>
  </div>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/catalogue.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
